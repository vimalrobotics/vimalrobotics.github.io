<section class="section image-slider-section">
  <div class="container">

    {% if include.title %}
    <div class="section__info">
      <div class="section__head">
        <h2 class="section__title">{{ include.title }}</h2>
      </div>
    </div>
    {% endif %}

    <div class="image-slider" data-slider>
      <div class="slider-wrapper">
        {% for img in include.images %}
          <div class="slide">
            <img src="{{ site.baseurl }}{{ img }}" alt="Project image">
          </div>
        {% endfor %}
      </div>
    </div>

  </div>
</section>

<script>
document.addEventListener("DOMContentLoaded", function () {
  if (typeof tns !== "undefined") {
    document.querySelectorAll('[data-slider]').forEach(function (slider) {
      tns({
        container: slider.querySelector('.slider-wrapper'),
        items: 1,
        slideBy: 1,
        autoplay: false,
        controls: true,
        nav: true,
        mouseDrag: true,
        gutter: 12
      });
    });
  }
});
</script>
