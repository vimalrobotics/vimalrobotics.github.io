<!-- begin gallery -->
<section class="section testimonials animate">
  <div class="container">
    <div class="row">
      <div class="col col-12">

        <div class="section__info">
          <div class="section__head">
            <h2 class="section__title">{{ include.title }}</h2>

            <!-- Gallery Controls -->
            <ul class="controls list-reset gallery-controls" aria-label="Slider Navigation">
              <li class="prev">
                <ion-icon name="arrow-back"></ion-icon>
              </li>
              <li class="next">
                <ion-icon name="arrow-forward"></ion-icon>
              </li>
            </ul>
          </div>

          {% if include.description_html %}
          <div class="section__description">
            {{ include.description_html }}
          </div>
          {% endif %}
        </div>

        {% if include.images %}
        <div class="testimonials__slider my-slider gallery-slider">
          {% for img in include.images %}
            {% bookshop gallery-card image=img %}
          {% endfor %}
        </div>
        {% endif %}

      </div>
    </div>
  </div>
</section>
<!-- end gallery -->

<script>
document.addEventListener("DOMContentLoaded", function () {
  if (typeof tns !== "undefined") {
    document.querySelectorAll(".gallery-slider").forEach(function (slider) {
      const controls = slider
        .closest(".section")
        .querySelector(".gallery-controls");

      tns({
        container: slider,
        items: 1,
        slideBy: 1,
        mouseDrag: true,
        controls: true,
        controlsContainer: controls,
        nav: false,
        autoplay: false,
        gutter: 24
      });
    });
  }
});
</script>
