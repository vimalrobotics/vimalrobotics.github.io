<section class="gallery">
  {% if include.title %}
    <h2 class="gallery__title">{{ include.title }}</h2>
  {% endif %}

  <div class="gallery__container">
    {% for item in include.images %}
      <div class="gallery__slide">
        <div class="gallery__count">
          {{ forloop.index }} / {{ include.images.size }}
        </div>

        <img
          src="{{ item.image | relative_url }}"
          alt="{{ item.caption }}"
          class="gallery__image">
      </div>
    {% endfor %}

    <button class="gallery__nav gallery__nav--prev" aria-label="Previous">
      &#10094;
    </button>

    <button class="gallery__nav gallery__nav--next" aria-label="Next">
      &#10095;
    </button>

    <div class="gallery__caption"></div>

    <div class="gallery__thumbs">
      {% for item in include.images %}
        <img
          src="{{ item.image | relative_url }}"
          alt="{{ item.caption }}"
          class="gallery__thumb"
          data-index="{{ forloop.index0 }}">
      {% endfor %}
    </div>
  </div>
</section>

<script>
(function () {
  const gallery = document.currentScript.previousElementSibling;
  const slides = gallery.querySelectorAll('.gallery__slide');
  const thumbs = gallery.querySelectorAll('.gallery__thumb');
  const caption = gallery.querySelector('.gallery__caption');
  const prev = gallery.querySelector('.gallery__nav--prev');
  const next = gallery.querySelector('.gallery__nav--next');

  let index = 0;
  let autoSlide;

  function showSlide(i) {
    index = (i + slides.length) % slides.length;

    slides.forEach(slide => {
      slide.style.display = 'none';
      slide.querySelector('.gallery__image')
           .classList.remove('is-zoomed');
    });

    thumbs.forEach(t => t.classList.remove('is-active'));

    slides[index].style.display = 'block';
    thumbs[index].classList.add('is-active');
    caption.textContent = thumbs[index].alt || '';
  }

  prev.addEventListener('click', () => showSlide(index - 1));
  next.addEventListener('click', () => showSlide(index + 1));

  thumbs.forEach(thumb => {
    thumb.addEventListener('click', () => {
      showSlide(+thumb.dataset.index);
    });
  });

  slides.forEach(slide => {
    const img = slide.querySelector('.gallery__image');
    img.addEventListener('click', () => {
      img.classList.toggle('is-zoomed');
    });
  });

  function startAutoSlide() {
    autoSlide = setInterval(() => showSlide(index + 1), 2500);
  }

  function stopAutoSlide() {
    clearInterval(autoSlide);
  }

  gallery.addEventListener('mouseenter', stopAutoSlide);
  gallery.addEventListener('mouseleave', startAutoSlide);

  showSlide(0);
  startAutoSlide();
})();
</script>
